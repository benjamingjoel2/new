name: Update sitemap

# Rebuilds sitemap.xml and robots.txt whenever pages change, so the sitemap
# always matches the pages that exist in the branch.
on:
  push:
    branches: ['**']
    paths-ignore: ['sitemap.xml', 'robots.txt']

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate sitemap.xml and robots.txt
        run: python3 tools/build_sitemap.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap.xml robots.txt; then
            echo "sitemap unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml robots.txt
            git commit -m "Update sitemap"
            git push
          fi
